name: Update GTFS Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
jobs:
  update:
    name: Update GTFS Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node env
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install

      - name: Update GTFS Data
        run: |
          npm run update-gtfs

      # http://man7.org/linux/man-pages/man1/date.1.html
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache GTFS data
        uses: actions/cache/save@v6
        with:
          path: gtfs
          key: gtfs-data-${{ steps.get-date.outputs.date }}
